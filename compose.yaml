name: pelazzo

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: pelazzo
      POSTGRES_USER: pelazzo
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pelazzo -d pelazzo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
