name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: pelazzo_test
          POSTGRES_USER: pelazzo
          POSTGRES_PASSWORD: ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pelazzo -d pelazzo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pelazzo:ci_only@localhost:5432/pelazzo_test?schema=public
      FRONTEND_ORIGIN: http://localhost:5173
      AUTH_SECRET: test-only-ci-auth-secret-at-least-32-characters
      AUTH_BASE_URL: http://localhost:3000
      SWAGGER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run format:check
      - run: node scripts/smoke.mjs
